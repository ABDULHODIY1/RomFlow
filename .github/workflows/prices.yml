name: Prices

# Once a day the catalog of prices is checked against the public pages it
# comes from; a change is committed, and the apps pick it up within a day.
on:
  schedule:
    - cron: '17 1 * * *' # 06:17 in Tashkent
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    name: Update the catalog of prices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tool/update_prices.py
      - name: Check the catalog
        run: |
          python3 -c "import json; d = json.load(open('assets/manufacturers_uz.json')); assert d['format'] == 'romflow-manufacturers' and d['systems'] and d['glass']; print('catalog v%d, %s' % (d['version'], d['date']))"
      - name: Commit the new prices
        run: |
          if git diff --quiet -- assets/manufacturers_uz.json; then
            echo "No price changed today."
            exit 0
          fi
          git config user.name "ABDULHODIY1"
          git config user.email "125181042+ABDULHODIY1@users.noreply.github.com"
          git commit -m "Prices: catalog v$(python3 -c "import json; print(json.load(open('assets/manufacturers_uz.json'))['version'])")" -- assets/manufacturers_uz.json
          git push
